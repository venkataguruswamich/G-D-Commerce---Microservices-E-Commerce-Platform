openapi: 3.0.3
info:
  title: G&D Commerce Microservices E-Commerce API
  description: >
    API surface exposed by the API Gateway (`/api/*`). Each path here is
    proxied to its owning microservice; paths shown are the gateway's public
    paths, not the internal service paths.
  version: '1.0.0'
  license:
    name: MIT
servers:
  - url: http://localhost:3000/api
    description: Local development (via API Gateway)

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Products
  - name: Categories
  - name: Orders
  - name: Payments
  - name: Notifications

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new customer account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and receive access/refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access/refresh token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token pair issued
        '401':
          description: Invalid or expired refresh token

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Logged out

  /users/me:
    get:
      tags: [Users]
      summary: Get the current authenticated user's profile
      responses:
        '200':
          description: Current user
        '401':
          description: Missing or invalid token
    put:
      tags: [Users]
      summary: Update the current user's profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string }
                lastName: { type: string }
      responses:
        '200':
          description: Updated profile

  /users:
    get:
      tags: [Users]
      summary: List all users (ADMIN only)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated user list
        '403':
          description: Insufficient permissions

  /users/{id}:
    get:
      tags: [Users]
      summary: Get a user by ID (ADMIN only)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: User
        '404':
          description: Not found

  /products:
    get:
      tags: [Products]
      summary: Search/list products
      security: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: minPrice
          in: query
          schema: { type: integer }
        - name: maxPrice
          in: query
          schema: { type: integer }
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, name_asc, name_desc, newest]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated product list
    post:
      tags: [Products]
      summary: Create a product (ADMIN only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
        '409':
          description: SKU already in use

  /products/{id}:
    get:
      tags: [Products]
      summary: Get a product by ID (Redis cache-aside)
      security: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Product
        '404':
          description: Not found
    put:
      tags: [Products]
      summary: Update a product (ADMIN only)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Products]
      summary: Delete a product (ADMIN only)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Deleted

  /products/inventory:
    get:
      tags: [Products]
      summary: List inventory across all products (ADMIN only)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated inventory list (product name/SKU joined with on-hand/reserved quantities)
        '403':
          description: Not an ADMIN

  /products/{id}/inventory:
    get:
      tags: [Products]
      summary: Get inventory for a product
      security: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Inventory record
    put:
      tags: [Products]
      summary: Update inventory for a product (ADMIN only)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer, minimum: 0 }
                reserved: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated inventory

  /categories:
    get:
      tags: [Categories]
      summary: List categories
      security: []
      responses:
        '200':
          description: Category list
    post:
      tags: [Categories]
      summary: Create a category (ADMIN only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Created

  /categories/{id}:
    put:
      tags: [Categories]
      summary: Update a category (ADMIN only)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Categories]
      summary: Delete a category (ADMIN only)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Deleted

  /orders:
    post:
      tags: [Orders]
      summary: Create an order from cart items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created (status PENDING)
        '422':
          description: A product in the cart is unavailable
    get:
      tags: [Orders]
      summary: List orders (own orders for CUSTOMER, all for ADMIN)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED]
      responses:
        '200':
          description: Paginated order list

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order by ID (owner or ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Order with items
        '403':
          description: Not your order
        '404':
          description: Not found

  /orders/{id}/status:
    put:
      tags: [Orders]
      summary: Update order status (ADMIN only, enforces valid transitions)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PENDING, CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED]
      responses:
        '200':
          description: Updated
        '409':
          description: Invalid status transition

  /payments:
    post:
      tags: [Payments]
      summary: Create a (simulated) payment for a PENDING order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: string, format: uuid }
                method:
                  type: string
                  enum: [SIMULATED, CARD, WALLET]
                  default: SIMULATED
      responses:
        '201':
          description: Payment resolved (SUCCESS or FAILED — simulated, no real charge)
        '409':
          description: Order not payable or payment already exists
    get:
      tags: [Payments]
      summary: List payments (ADMIN only)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, SUCCESS, FAILED, REFUNDED]
      responses:
        '200':
          description: Paginated payment list
        '403':
          description: Not an ADMIN

  /payments/{id}:
    get:
      tags: [Payments]
      summary: Get a payment by ID (owner or ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Payment
        '403':
          description: Not your payment

  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications (own for CUSTOMER, all for ADMIN)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated notification list

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    ApiSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: object }
        requestId: { type: string }

    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
        requestId: { type: string }

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        firstName: { type: string }
        lastName: { type: string }

    ProductInput:
      type: object
      required: [sku, name, priceCents]
      properties:
        sku: { type: string }
        name: { type: string }
        description: { type: string }
        priceCents: { type: integer, minimum: 0 }
        currency: { type: string, default: USD }
        categoryId: { type: string, format: uuid, nullable: true }
        imageUrl: { type: string, format: uri, nullable: true }

    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        description: { type: string }

    CreateOrderRequest:
      type: object
      required: [items, shippingAddress]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
        shippingAddress:
          type: object
          required: [line1, city, state, postalCode, country]
          properties:
            line1: { type: string }
            line2: { type: string }
            city: { type: string }
            state: { type: string }
            postalCode: { type: string }
            country: { type: string }
