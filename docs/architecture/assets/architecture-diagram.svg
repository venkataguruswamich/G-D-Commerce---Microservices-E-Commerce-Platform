<svg viewBox="0 0 1600 940" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="System architecture: a user's browser talks to the React frontend, which calls the API Gateway, which routes to five backend services. Order and Payment services call each other synchronously for authoritative data, publish events to RabbitMQ, and all five services share one PostgreSQL database; Product Service additionally uses Redis as a cache in front of Postgres.">
  <defs>
    <marker id="aBlack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7e22ce"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="940" fill="#ffffff"/>

  <text x="800" y="30" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Cloud-Native E-Commerce — System Architecture</text>
  <text x="800" y="52" text-anchor="middle" font-size="13" fill="#6b7280">How one request travels from the browser through every container in `docker compose`</text>

  <!-- Docker boundary -->
  <rect x="20" y="150" width="1560" height="740" rx="14" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="175" font-size="13" font-style="italic" fill="#6b7280">Docker Compose network — "ecommerce-network" (everything below this line is a container)</text>

  <!-- User -->
  <rect x="700" y="68" width="200" height="46" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="800" y="96" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">User / Browser</text>
  <line x1="800" y1="114" x2="800" y2="147" stroke="#111827" stroke-width="2" marker-end="url(#aBlack)"/>
  <text x="815" y="134" font-size="12" fill="#111827">HTTPS</text>

  <!-- Frontend -->
  <rect x="580" y="150" width="440" height="56" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="800" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">React Frontend (Vite)</text>
  <text x="800" y="192" text-anchor="middle" font-size="12" fill="#312e81">Port 5173 · AuthContext (JWT) · CartContext</text>
  <line x1="800" y1="206" x2="800" y2="241" stroke="#111827" stroke-width="2" marker-end="url(#aBlack)"/>
  <text x="815" y="227" font-size="12" fill="#111827">REST /api/*</text>

  <!-- Gateway -->
  <rect x="520" y="244" width="560" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="800" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">API Gateway — Node/Express · Port 3000</text>
  <text x="800" y="286" text-anchor="middle" font-size="12" fill="#78350f">JWT verification · rate limiting · CORS · reverse proxy</text>

  <!-- Gateway fan-out -->
  <line x1="600" y1="300" x2="180" y2="337" stroke="#111827" stroke-width="1.8" marker-end="url(#aBlack)"/>
  <line x1="700" y1="300" x2="490" y2="337" stroke="#111827" stroke-width="1.8" marker-end="url(#aBlack)"/>
  <line x1="800" y1="300" x2="800" y2="337" stroke="#111827" stroke-width="1.8" marker-end="url(#aBlack)"/>
  <line x1="900" y1="300" x2="1110" y2="337" stroke="#111827" stroke-width="1.8" marker-end="url(#aBlack)"/>
  <line x1="1000" y1="300" x2="1420" y2="337" stroke="#111827" stroke-width="1.8" marker-end="url(#aBlack)"/>
  <text x="800" y="317" text-anchor="middle" font-size="11" fill="#111827">routes /api/{resource}/* to the owning service</text>

  <!-- Services row -->
  <g>
    <rect x="40" y="340" width="280" height="90" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="180" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">User Service :3001</text>
    <text x="180" y="388" text-anchor="middle" font-size="12" fill="#1e3a8a">Register · Login</text>
    <text x="180" y="406" text-anchor="middle" font-size="12" fill="#1e3a8a">JWT + refresh · RBAC</text>
  </g>
  <g>
    <rect x="350" y="340" width="280" height="90" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="490" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Product Service :3002</text>
    <text x="490" y="388" text-anchor="middle" font-size="12" fill="#1e3a8a">Catalog · Inventory · Search</text>
    <text x="490" y="406" text-anchor="middle" font-size="12" fill="#1e3a8a">Redis cache-aside</text>
  </g>
  <g>
    <rect x="660" y="340" width="280" height="90" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="800" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Order Service :3003</text>
    <text x="800" y="388" text-anchor="middle" font-size="12" fill="#1e3a8a">Cart → Order lifecycle</text>
    <text x="800" y="406" text-anchor="middle" font-size="12" fill="#1e3a8a">Publishes order.*</text>
  </g>
  <g>
    <rect x="970" y="340" width="280" height="90" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="1110" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Payment Service :3004</text>
    <text x="1110" y="388" text-anchor="middle" font-size="12" fill="#1e3a8a">Simulated payments</text>
    <text x="1110" y="406" text-anchor="middle" font-size="12" fill="#1e3a8a">Publishes payment.*</text>
  </g>
  <g>
    <rect x="1280" y="340" width="280" height="90" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="1420" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Notification Service :3005</text>
    <text x="1420" y="388" text-anchor="middle" font-size="12" fill="#1e3a8a">Consumes all events</text>
    <text x="1420" y="406" text-anchor="middle" font-size="12" fill="#1e3a8a">Records notifications</text>
  </g>

  <!-- Sync cross-service calls -->
  <polyline points="700,430 650,460 600,430" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aBlue)"/>
  <rect x="603" y="443" width="94" height="18" fill="#ffffff" stroke="#1d4ed8" stroke-width="1" rx="3"/>
  <text x="650" y="456" text-anchor="middle" font-size="11" fill="#1d4ed8">GET /products/:id</text>

  <polyline points="1010,430 955,460 900,430" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aBlue)"/>
  <rect x="900" y="443" width="110" height="18" fill="#ffffff" stroke="#1d4ed8" stroke-width="1" rx="3"/>
  <text x="955" y="456" text-anchor="middle" font-size="11" fill="#1d4ed8">GET /orders/:id</text>

  <!-- Bus to Postgres -->
  <line x1="180" y1="485" x2="1420" y2="485" stroke="#047857" stroke-width="1.5"/>
  <line x1="180" y1="430" x2="180" y2="485" stroke="#047857" stroke-width="1.5"/>
  <line x1="490" y1="430" x2="490" y2="485" stroke="#047857" stroke-width="1.5"/>
  <line x1="800" y1="430" x2="800" y2="485" stroke="#047857" stroke-width="1.5"/>
  <line x1="1110" y1="430" x2="1110" y2="485" stroke="#047857" stroke-width="1.5"/>
  <line x1="1420" y1="430" x2="1420" y2="485" stroke="#047857" stroke-width="1.5"/>
  <line x1="800" y1="485" x2="800" y2="652" stroke="#047857" stroke-width="2.5" marker-end="url(#aRed)" />
  <rect x="655" y="490" width="290" height="18" fill="#ffffff" stroke="#047857" stroke-width="1" rx="3"/>
  <text x="800" y="503" text-anchor="middle" font-size="11" fill="#047857">every service owns its own tables in one shared instance</text>

  <!-- Redis -->
  <line x1="610" y1="430" x2="460" y2="503" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aRed)"/>
  <rect x="350" y="505" width="280" height="80" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="490" y="533" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Redis 7 — Cache-Aside</text>
  <text x="490" y="553" text-anchor="middle" font-size="12" fill="#7f1d1d">Product catalog reads</text>
  <text x="490" y="571" text-anchor="middle" font-size="12" fill="#7f1d1d">TTL 300s · invalidated on write</text>

  <!-- RabbitMQ -->
  <line x1="760" y1="430" x2="920" y2="505" stroke="#7e22ce" stroke-width="2.5" marker-end="url(#aPurple)"/>
  <rect x="595" y="443" width="150" height="18" fill="#ffffff" stroke="#7e22ce" stroke-width="1" rx="3"/>
  <text x="670" y="456" text-anchor="middle" font-size="11" fill="#7e22ce">publish order.created</text>

  <line x1="1110" y1="430" x2="1080" y2="505" stroke="#7e22ce" stroke-width="2.5" marker-end="url(#aPurple)"/>
  <rect x="1085" y="455" width="190" height="18" fill="#ffffff" stroke="#7e22ce" stroke-width="1" rx="3"/>
  <text x="1180" y="468" text-anchor="middle" font-size="11" fill="#7e22ce">publish payment.success/failed</text>

  <line x1="1200" y1="545" x2="1420" y2="430" stroke="#7e22ce" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aPurple)"/>
  <rect x="1225" y="475" width="210" height="18" fill="#ffffff" stroke="#7e22ce" stroke-width="1" rx="3"/>
  <text x="1330" y="488" text-anchor="middle" font-size="11" fill="#7e22ce">consume all events → record</text>

  <line x1="880" y1="545" x2="840" y2="430" stroke="#7e22ce" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aPurple)"/>
  <rect x="700" y="600" width="260" height="18" fill="#ffffff" stroke="#7e22ce" stroke-width="1" rx="3"/>
  <text x="830" y="613" text-anchor="middle" font-size="11" fill="#7e22ce">consume payment.* → confirm/cancel order</text>

  <rect x="880" y="505" width="320" height="100" rx="8" fill="#fce7f3" stroke="#a21caf" stroke-width="2"/>
  <text x="1040" y="533" text-anchor="middle" font-size="14" font-weight="700" fill="#701a75">RabbitMQ — ecommerce.events</text>
  <text x="1040" y="553" text-anchor="middle" font-size="12" fill="#701a75">Topic exchange · durable queues</text>
  <text x="1040" y="571" text-anchor="middle" font-size="12" fill="#701a75">Retry (3x, 5s) then dead-letter</text>
  <text x="1040" y="589" text-anchor="middle" font-size="12" fill="#701a75">Never silently drops a message</text>

  <!-- Postgres -->
  <rect x="460" y="655" width="680" height="90" rx="10" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="800" y="685" text-anchor="middle" font-size="15" font-weight="700" fill="#064e3b">PostgreSQL 16 — single shared instance</text>
  <text x="800" y="707" text-anchor="middle" font-size="12" fill="#064e3b">users · roles · refresh_tokens · products · categories · inventory</text>
  <text x="800" y="727" text-anchor="middle" font-size="12" fill="#064e3b">orders · order_items · payments · notifications</text>

  <!-- Legend -->
  <rect x="1200" y="640" width="340" height="230" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="1220" y="665" font-size="14" font-weight="700" fill="#111827">Legend</text>

  <line x1="1220" y1="683" x2="1255" y2="683" stroke="#111827" stroke-width="2" marker-end="url(#aBlack)"/>
  <text x="1265" y="688" font-size="12" fill="#111827">User-facing HTTP path</text>

  <line x1="1220" y1="708" x2="1255" y2="708" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aBlue)"/>
  <text x="1265" y="713" font-size="12" fill="#111827">Sync. service-to-service call</text>

  <line x1="1220" y1="733" x2="1255" y2="733" stroke="#7e22ce" stroke-width="2.5" marker-end="url(#aPurple)"/>
  <text x="1265" y="738" font-size="12" fill="#111827">Publish event to RabbitMQ</text>

  <line x1="1220" y1="758" x2="1255" y2="758" stroke="#7e22ce" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aPurple)"/>
  <text x="1265" y="763" font-size="12" fill="#111827">Consume event from RabbitMQ</text>

  <line x1="1220" y1="783" x2="1255" y2="783" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aRed)"/>
  <text x="1265" y="788" font-size="12" fill="#111827">Redis cache read/write</text>

  <line x1="1220" y1="808" x2="1255" y2="808" stroke="#047857" stroke-width="2"/>
  <text x="1265" y="813" font-size="12" fill="#111827">Shared Postgres connection</text>

  <rect x="1220" y="828" width="35" height="14" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1265" y="839" font-size="12" fill="#111827">Docker network boundary</text>

  <text x="800" y="915" text-anchor="middle" font-size="12" fill="#6b7280">All 12 containers start with one command: `docker compose -f docker/docker-compose.yml up -d`</text>
</svg>
